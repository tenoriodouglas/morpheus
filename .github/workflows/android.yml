name: Android CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to deploy to"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status. Use 'draft' for the very first upload of an app that has never been published (Play only allows draft releases on a draft app); switch to 'completed' once the app is live to auto-roll-out."
        required: true
        default: "draft"
        type: choice
        options: [draft, completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # Needed to publish the debug APK to a GitHub Release (direct download link).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms & build-tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Include Firebase in the debug APK too (remote control) when the secret
      # is present. Requires BOTH package names (com.morpheus.family and
      # com.morpheus.family.debug) registered in the Firebase project, otherwise
      # the google-services plugin fails to match the debug applicationId.
      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "google-services.json written (Firebase enabled)."
          else
            echo "No google-services.json secret; building without Firebase."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        # Give the debug APK an increasing versionCode so the GitHub self-updater
        # can tell builds apart (matches the number written into latest.json).
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Give the APK a stable filename and write the self-update manifest, then
      # publish both to a rolling GitHub Release so they have permanent,
      # login-free download links:
      #   https://github.com/tenoriodouglas/morpheus/releases/download/apk-latest/morpheus-latest-debug.apk
      #   https://github.com/tenoriodouglas/morpheus/releases/download/apk-latest/latest.json
      - name: Stage APK and update manifest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/morpheus-latest-debug.apk
          cat > release-apk/latest.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.0", "apkUrl": "https://github.com/tenoriodouglas/morpheus/releases/download/apk-latest/morpheus-latest-debug.apk"}
          EOF

      - name: Publish debug APK to a rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Morpheus — última APK (debug)
          body: >
            APK de teste (debug) gerada automaticamente pela CI a partir do último
            commit. Instala lado a lado com a versão da Play Store
            (pacote com.morpheus.family.debug).
          prerelease: true
          files: |
            release-apk/morpheus-latest-debug.apk
            release-apk/latest.json

  deploy:
    name: Release to Play Store
    needs: build
    runs-on: ubuntu-latest
    # Needed to publish the signed provisioning APK + manifest to the release.
    permissions:
      contents: write
    # Only run for version tags (e.g. v1.0.0) or a manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms & build-tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          [ -z "$KEYSTORE_BASE64" ] && { echo "::error::Missing secret KEYSTORE_BASE64"; missing=1; }
          [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] && { echo "::error::Missing secret PLAY_SERVICE_ACCOUNT_JSON"; missing=1; }
          [ "$missing" = "1" ] && exit 1 || echo "Secrets present."

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "google-services.json written."
          else
            echo "No google-services.json secret; building without Firebase."
          fi

      - name: Build signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Unique, increasing versionCode per upload (offset above manual uploads).
          VERSION_CODE: ${{ github.run_number }}00
        run: ./gradlew bundleRelease --stacktrace

      # Publish the signed AAB as a downloadable artifact BEFORE trying Play,
      # so a manual test run always yields the .aab even if the Play upload
      # can't run yet (app not created on Play).
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ---- Device Owner provisioning: a signed release APK at a FIXED URL, plus a
      # manifest carrying its signing checksum, so the parent app can render the
      # provisioning QR with zero manual input.
      - name: Build signed release APK (Device Owner provisioning)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}00
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage provisioning APK + manifest
        run: |
          set -e
          mkdir -p provisioning
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -z "$APK" ] && { echo "::error::No release APK found"; exit 1; }
          cp "$APK" provisioning/morpheus-release.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -1)
          echo "Using apksigner: $APKSIGNER"
          HEX=$("$APKSIGNER" verify --print-certs provisioning/morpheus-release.apk \
            | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}')
          echo "cert SHA-256 (hex): $HEX"
          # Android expects URL-safe base64 (no padding) of the raw cert SHA-256 bytes.
          CHK=$(python3 -c "import sys,base64,binascii; print(base64.urlsafe_b64encode(binascii.unhexlify(sys.argv[1].replace(':',''))).decode().rstrip('='))" "$HEX")
          echo "checksum (b64url): $CHK"
          URL="https://github.com/${{ github.repository }}/releases/download/apk-latest/morpheus-release.apk"
          printf '{"apkUrl": "%s", "checksum": "%s"}\n' "$URL" "$CHK" > provisioning/provisioning.json
          cat provisioning/provisioning.json

      - name: Publish provisioning APK + manifest to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          files: |
            provisioning/morpheus-release.apk
            provisioning/provisioning.json

      - name: Upload to Google Play
        # Manual test runs don't fail if the app isn't on Play yet; tag releases do.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.morpheus.family
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          # Tag pushes auto-roll-out (completed); manual dispatch defaults to
          # draft so the very first upload of a not-yet-published app succeeds.
          status: ${{ github.event.inputs.status || 'completed' }}
