name: Deploy Firestore Rules

# Publishes firestore.rules to your Firebase project. Run it manually from the
# Actions tab (or it runs automatically when firestore.rules changes on the
# default branch).
#
# One-time setup (only you can do this — the credential never touches chat):
#   1. On your machine:  npm i -g firebase-tools && firebase login:ci
#      Copy the token it prints.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#      Name: FIREBASE_TOKEN   Value: <the token>
#   The project id is read from the existing GOOGLE_SERVICES_JSON_BASE64 secret,
#   so no extra project secret is needed.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "firestore.rules"
      - ".github/workflows/firestore-rules.yml"

jobs:
  deploy-rules:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node is preinstalled on ubuntu-latest runners.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Resolve project id from google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set; cannot resolve the Firebase project id."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > /tmp/google-services.json
          PROJECT_ID=$(node -e "console.log(require('/tmp/google-services.json').project_info.project_id)")
          echo "Resolved Firebase project id: $PROJECT_ID"
          echo "FIREBASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Deploy rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Create it with 'firebase login:ci' and add it under repo Settings -> Secrets -> Actions."
            exit 1
          fi
          firebase deploy --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --debug
